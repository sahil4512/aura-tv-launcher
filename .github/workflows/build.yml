name: Build and test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" > /dev/null
      - name: Unit tests and debug build
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Check the tools
        run: |
          python3 -m py_compile tools/aura-setup tools/*.py
          python3 tools/aura-setup --help > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: aura-tv-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
